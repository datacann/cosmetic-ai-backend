services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cosmetic_ai
      POSTGRES_USER: cosmetic
      POSTGRES_PASSWORD: cosmetic
    ports:
      - "5432:5432"
    volumes:
      - cosmetic_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmetic -d cosmetic_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cosmetic_ai_postgres:
